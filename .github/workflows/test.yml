name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SCHLUSSEL_TO_GLOCKE_HMAC_SECRET: ci-only-producer-secret-at-least-32-bytes
      GLOCKE_TO_SCHLUSSEL_HMAC_SECRET: ci-only-recipient-secret-at-least-32-bytes
      KUVERT_TO_GLOCKE_HMAC_SECRET: ci-only-kuvert-producer-secret-at-least-32-bytes
      TAFEL_TO_GLOCKE_HMAC_SECRET: ci-only-tafel-producer-secret-at-least-32-bytes
      ZETTEL_TO_GLOCKE_HMAC_SECRET: ci-only-zettel-producer-secret-at-least-32-bytes
      WACHTER_AGENT_TOKEN: ci-only-wachter-agent-token-at-least-32-bytes
      GLOCKE_VAPID_SUBJECT: mailto:push-ci@example.invalid
      GLOCKE_VAPID_PUBLIC_KEY: BG4K7M8AHsPWw4WdwJLwXL0ELAxKM_WfdUsGfxgkaT7ZfAIN1MbsHhgk6HsfFoYXs34tS4Eeg2gxeYEHssNkyCE
      GLOCKE_VAPID_PRIVATE_KEY: buJ8MeuiDFugpvAMEPf3vgV_bz3tlNVECD0MoMgryUw
      HEROLD_CREDENTIAL_ENCRYPTION_KEY: ci-only-herold-credential-key-at-least-32-bytes
    steps:
      - uses: actions/checkout@v7
        with:
          path: tor

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/schlussel
          path: schlussel
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/schloss
          path: schloss
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/kuvert
          path: kuvert
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/tafel
          path: tafel
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/zettel
          path: zettel
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/glocke
          path: glocke
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/schrank
          path: schrank
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: zudaR107/herold
          path: herold
          submodules: recursive

      # vrubovoy, not zudaR107 - wachter was created fresh after the
      # account rename, so there's no zudaR107/wachter to redirect from
      # (unlike every checkout above, all of which predate the rename
      # and still resolve through GitHub's own username redirect).
      - uses: actions/checkout@v7
        with:
          repository: vrubovoy/wachter
          path: wachter
          submodules: recursive

      - name: Validate Caddyfile
        run: >
          docker run --rm -v "$PWD/tor/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Test gateway routing and unknown hosts
        run: sh tor/test/validate-gateway.sh

      - name: Test public origin validation
        working-directory: tor
        run: node test/validate-public-origin.mjs --self-test

      - name: Validate local example Compose configuration
        working-directory: tor
        run: sh test/validate-compose.sh .env.example

      - name: Validate production example Compose configuration
        working-directory: tor
        run: sh test/validate-compose.sh .env.production.example

      - name: Test enabled and disabled Browser Push configuration
        working-directory: tor
        run: sh test/validate-push-config.sh

      - name: Build notification-enabled frontend and Glocke images
        working-directory: tor
        run: >
          docker compose build schloss schlussel-frontend kuvert-frontend
          tafel-frontend zettel-frontend glocke-backend glocke-frontend

      - name: Build identity and account lifecycle images
        working-directory: tor
        run: >
          docker compose build schlussel kuvert-backend tafel-backend
          zettel-backend

      - name: Build Schrank images
        working-directory: tor
        run: docker compose build schrank-backend schrank-frontend

      - name: Build Herold images
        working-directory: tor
        run: docker compose build herold-backend herold-frontend

      - name: Smoke-test runtime frontend configuration
        working-directory: tor
        run: sh test/validate-runtime-config.sh

      - name: Build Wächter images
        working-directory: tor
        run: docker compose build wachter wachter-agent

      - name: Smoke-test built service worker through gateway
        working-directory: tor
        run: sh test/validate-sw.sh
