# One-time setup, before first `docker compose up`:
#   docker network create schloss-net
#
# Starts the entire platform from here: this file pulls in each sibling
# repo's own docker-compose.yml via `include:` (paths are relative to this
# file, assuming the standard layout where schlussel/, schloss/, kuvert/,
# tafel/, zettel/, glocke/, schrank/, herold/, wachter/, and tor/ are
# sibling directories) and fronts all eight apps with a single Caddy
# gateway that routes by subdomain - nothing else needs a published host
# port. Wächter is the one exception: it has no subdomain of its own,
# it's reached only via Schloss's own Caddyfile proxy (see wachter's own
# README) - included here purely so `docker compose up` from this file
# still starts it alongside everything else. Each repo's own compose
# file still works standalone for isolated single-app development. Per-include
# overrides apply Tor's whole-platform restart policy without conflicting with
# imported service definitions: data/control services are protected, while
# stateless frontends are explicitly restartable and non-critical.
include:
  - path:
      - ../schlussel/docker-compose.yml
      - ./compose/schlussel.override.yml
  - path:
      - ../schloss/docker-compose.yml
      - ./compose/schloss.override.yml
  - path:
      - ../kuvert/docker-compose.yml
      - ./compose/kuvert.override.yml
  - path:
      - ../tafel/docker-compose.yml
      - ./compose/tafel.override.yml
  - path:
      - ../zettel/docker-compose.yml
      - ./compose/zettel.override.yml
  - path:
      - ../glocke/docker-compose.yml
      - ./compose/glocke.override.yml
  - path:
      - ../schrank/docker-compose.yml
      - ./compose/schrank.override.yml
  - path:
      - ../herold/docker-compose.yml
      - ./compose/herold.override.yml
  - path: ../wachter/docker-compose.yml

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    labels:
      hof.wachter.critical: "true"
    networks:
      - schloss-net

volumes:
  caddy-data:

networks:
  schloss-net:
    external: true
