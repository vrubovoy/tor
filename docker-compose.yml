# One-time setup, before first `docker compose up`:
#   docker network create schloss-net
#
# Starts the entire platform from here: this file pulls in each sibling
# repo's own docker-compose.yml via `include:` (paths are relative to this
# file, assuming the standard layout where schlussel/, schloss/, kuvert/,
# tafel/, zettel/, glocke/, schrank/, herold/, wachter/, and tor/ are
# sibling directories) and fronts all eight apps with a single Caddy
# gateway that routes by subdomain - nothing else needs a published host
# port. Wächter is the one exception: it has no subdomain of its own,
# it's reached only via Schloss's own Caddyfile proxy (see wachter's own
# README) - included here purely so `docker compose up` from this file
# still starts it alongside everything else. Each repo's own compose
# file still works standalone for isolated single-app development.
include:
  - path: ../schlussel/docker-compose.yml
  - path: ../schloss/docker-compose.yml
  - path: ../kuvert/docker-compose.yml
  - path: ../tafel/docker-compose.yml
  - path: ../zettel/docker-compose.yml
  - path: ../glocke/docker-compose.yml
  - path: ../schrank/docker-compose.yml
  - path: ../herold/docker-compose.yml
  - path: ../wachter/docker-compose.yml

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    labels:
      hof.wachter.critical: "true"
    networks:
      - schloss-net

  # Tor owns the whole-platform restart policy. Data-bearing and control-plane
  # containers are protected; only stateless frontends can be restarted from
  # Wächter. Every restartable service also has an explicit critical=false so
  # the agent's deny-wins rule remains visible in the resolved configuration.
  schloss:
    labels:
      hof.wachter.critical: "true"

  schlussel:
    labels:
      hof.wachter.critical: "true"

  schlussel-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  kuvert-backend:
    labels:
      hof.wachter.critical: "true"

  kuvert-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  tafel-backend:
    labels:
      hof.wachter.critical: "true"

  tafel-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  zettel-backend:
    labels:
      hof.wachter.critical: "true"

  zettel-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  glocke-backend:
    labels:
      hof.wachter.critical: "true"

  glocke-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  schrank-backend:
    labels:
      hof.wachter.critical: "true"

  schrank-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  herold-backend:
    labels:
      hof.wachter.critical: "true"

  herold-frontend:
    labels:
      hof.wachter.restartable: "true"
      hof.wachter.critical: "false"

  wachter:
    labels:
      hof.wachter.critical: "true"

  wachter-agent:
    labels:
      hof.wachter.critical: "true"

volumes:
  caddy-data:

networks:
  schloss-net:
    external: true
